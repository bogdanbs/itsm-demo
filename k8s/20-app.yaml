apiVersion: apps/v1
kind: Deployment
metadata:
  name: itsm-demo
  namespace: itsm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: itsm-demo
  template:
    metadata:
      labels:
        app: itsm-demo
    spec:
      containers:
        - name: wildfly
          image: itsm-demo:0.1.0
          imagePullPolicy: Never   # Image wird mit "minikube image build" lokal gebaut
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: FLYWAY_ENABLED
              value: "true"
            - name: DB_HOST
              value: postgres       # Name des Kubernetes-Service
            - name: DB_PORT
              value: "5432"
          envFrom:
            - secretRef:
                name: itsm-db       # DB_NAME, DB_USER, DB_PASSWORD
          readinessProbe:
            httpGet: { path: /itsm-demo/api/health/ready, port: http }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /itsm-demo/api/health/live, port: http }
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { memory: "512Mi", cpu: "250m" }
            limits:   { memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: itsm-demo
  namespace: itsm
spec:
  selector:
    app: itsm-demo
  ports:
    - name: http
      port: 8080
      targetPort: http
